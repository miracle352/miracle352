<title id="t">Miracle Iyanuoluwa: receipt</title>
<desc id="d">A receipt printing out of a thermal printer. Items: Choiceproof, LastCopy and Blotter are live; FlyTab runs locally. Claims without evidence: 0. Total: proof attached. Stamped verified. The barcode scans to github.com/miracle352.</desc>
<style>
  text { font-family: ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
  .ink { animation: ink .28s ease-out both; }
  .stamp { animation: stamp .32s cubic-bezier(.2,1.6,.4,1) both; transform-box: fill-box; transform-origin: center; }
  .led { animation: blink .32s steps(2, jump-none) 10 both; }
  .busy { animation: out .2s ease 3.2s both; }
  .done { animation: in .3s ease 3.3s both; }
  @keyframes ink { from { opacity: 0; } to { opacity: 1; } }
  @keyframes stamp { 0% { opacity: 0; transform: scale(1.9); } 100% { opacity: .9; transform: scale(1); } }
  @keyframes blink { from { opacity: .25; } to { opacity: 1; } }
  @keyframes out { to { opacity: 0; } }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .ink, .stamp, .led, .busy, .done { animation: none; }
    .busy { opacity: 0; }
  }
</style>
